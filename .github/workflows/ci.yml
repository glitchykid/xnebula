name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.15.2'
      - name: Install development tools
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Download official portable Python runtime
        run: Invoke-WebRequest -Uri https://www.python.org/ftp/python/3.15.2/python-3.15.2-embed-amd64.zip -OutFile "$env:RUNNER_TEMP/python-embed.zip"
      - name: Build verified portable ZIP
        run: python scripts/build_portable.py --runtime "$env:RUNNER_TEMP/python-embed.zip"
      - name: Test with coverage
        run: python -m coverage run tests/run_tests.py
      - name: Enforce coverage
        run: python -m coverage report
      - name: Build distribution
        run: python -m build
